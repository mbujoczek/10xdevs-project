name: Frontend Build and Test
description: Reusable composite action for building and testing Vue.js frontend

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'frontend/.nvmrc'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      shell: pwsh
      working-directory: frontend
      run: npm ci

    - name: Lint code
      shell: pwsh
      working-directory: frontend
      run: npm run lint

    - name: Type check
      shell: pwsh
      working-directory: frontend
      run: npm run type-check

    - name: Run unit tests
      shell: pwsh
      working-directory: frontend
      run: npm run test:unit
